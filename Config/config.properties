url=https://test.uncs.info/auth/login
email=luffynew@gmail.com

# --- Browser window ---
# false runs Chrome with a visible window, true runs it headless.
# A single run can be flipped without editing this file:
#   mvn test -Dheadless=true
#   mvn test -Dheadless=false
# The -D value always wins over the one set here.
headless=true

# --- Report email ---
# The run's Extent report and its last screenshot are emailed when the run finishes.
# The password is never kept here: it comes from -Duncs.mail.password, the
# UNCS_MAIL_PASSWORD environment variable, or Config/secrets.properties, in that order.
# With no password configured the run simply skips the email and still passes or fails
# on its own merits.
mail.smtp.host=smtp.gmail.com
mail.smtp.port=465
mail.from=lawma195.infinity@gmail.com
mail.to=lawma195.infinity@gmail.com
mail.smtp.auth=true
mail.smtp.starttls.enable=true
